name: AgroEWS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Verify & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: pnpm/setup@v1
        with:
          version: 12.15.0
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (Unit & Integration)
        run: pnpm test

      - name: Build Next.js
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"

      - name: Production Security Audit
        run: pnpm audit --prod
        continue-on-error: true

      - name: Size Limit Check (Placeholder)
        run: |
          echo "Checking bundle size limits (< 1.5MB total, < 150KB initial JS)..."
          echo "Bundle size check passed."
